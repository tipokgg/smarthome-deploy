# Шаблон настроек zigbee2mqtt. setup.sh копирует его в data/zigbee2mqtt/configuration.yaml, только если там файла ещё нет:
# zigbee2mqtt переписывает свой файл сам (ключ сети, устройства, настройки из веб-интерфейса), и правки здесь на работающую
# сеть не влияют. Адрес координатора и токен веб-интерфейса приходят из .env через переменные в compose.yml.
version: 5

homeassistant:
  enabled: false

frontend:
  enabled: true
  port: 8080

mqtt:
  base_topic: zigbee2mqtt
  server: mqtt://mosquitto:1883

serial:
  # SLZB-06P7U - CC2652P7 с прошивкой Z-Stack, к нему по TCP (порт задаётся в compose.yml из ZIGBEE_ADAPTER_HOST)
  adapter: zstack
  baudrate: 115200

# последнее состояние устройств хранится в брокере (retained): бэкенд после перезапуска сразу видит датчики, а не ждёт,
# пока каждый что-то пришлёт (TS0201 молчит до получаса и дольше)
device_options:
  retain: true

# устройство на связи или нет: <имя>/availability; батарейные считаются пропавшими через 25 ч, от сети - через 10 мин
availability:
  enabled: true

advanced:
  # Канал выбирается один раз: смена канала потом - переподключение устройств. 25 не пересекается с Wi-Fi 1/6/11;
  # Wi-Fi дома - 2,4 ГГц на 1-м канале шириной 40 МГц (2402-2442 МГц), Zigbee 25 - 2475 МГц
  channel: 25
  network_key: GENERATE
  pan_id: GENERATE
  ext_pan_id: GENERATE
  # время последнего сообщения в каждом состоянии: по нему бэкенд пишет момент показания
  last_seen: ISO_8601
  log_level: info
  log_output:
    - console
