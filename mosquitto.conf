# Mosquitto для zigbee2mqtt и бэкенда. Порт наружу из Docker не открыт, поэтому без паролей.
# Если понадобится доступ из сети (ESPHome, отладка с Мака) - сначала пароли (password_file), потом ports в compose.yml
listener 1883
allow_anonymous true

# retained-сообщения (список устройств zigbee2mqtt, последние состояния) переживают перезапуск брокера
persistence true
persistence_location /mosquitto/data/
autosave_interval 300

log_dest stdout
log_type error
log_type warning
log_type notice
