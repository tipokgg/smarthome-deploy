# Умный дом на домашнем сервере. Образы и их версии - в .env (BACKEND_IMAGE, FRONTEND_IMAGE),
# их переключает scripts/update.sh. Секреты бэкенда - в config/application.yml, база - в data/.
name: smarthome

x-logging: &logging
  driver: local
  options:
    max-size: 10m
    max-file: "5"

services:
  backend:
    image: ${BACKEND_IMAGE:?BACKEND_IMAGE не задан в .env}
    restart: unless-stopped
    environment:
      # тарифы день/ночь, расписания и история считаются по местному времени
      TZ: Europe/Moscow
      # бот для уведомлений о сбоях устройств и автоматизаций - тот же, что у scripts/update.sh
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      # мост к телевизорам Android TV - сервис ниже
      TV_BRIDGE_URL: http://tv-bridge:8090
    volumes:
      - ./config:/app/config:ro
      - ./data:/data
    # здесь, а не в образе: по нему scripts/update.sh решает, поднялась ли новая версия, и проверка не должна
    # зависеть от того, что в образе
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/actuator/health"]
      interval: 15s
      timeout: 5s
      start_period: 90s
      start_interval: 3s
      retries: 3
    logging: *logging

  # мост к телевизорам Android TV по протоколу пульта Google TV (исходник - smarthome-backend/tv-bridge).
  # Наружу порт не открыт: ходит к нему только бэкенд. В data/tv-bridge - сертификат, который телевизоры
  # запомнили при сопряжении: потеряется - сопрягать заново
  tv-bridge:
    image: ${TV_BRIDGE_IMAGE:-ghcr.io/tipokgg/smarthome-tv-bridge:main}
    restart: unless-stopped
    volumes:
      - ./data/tv-bridge:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      start_period: 10s
      start_interval: 2s
      retries: 3
    logging: *logging

  # Камеры: go2rtc забирает RTSP с камер и отдаёт видео браузеру через nginx фронта (/camera/ws). Какие камеры есть -
  # go2rtc.yaml рядом. Наружу порт не открыт: API go2rtc без авторизации и умеет запускать команды. Версия закреплена,
  # scripts/update.sh её не обновляет
  go2rtc:
    image: ${GO2RTC_IMAGE:-alexxit/go2rtc:1.9.14}
    restart: unless-stopped
    volumes:
      - ./go2rtc.yaml:/config/go2rtc.yaml:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:1984/api"]
      interval: 15s
      timeout: 5s
      start_period: 10s
      start_interval: 2s
      retries: 3
    logging: *logging

  frontend:
    image: ${FRONTEND_IMAGE:?FRONTEND_IMAGE не задан в .env}
    restart: unless-stopped
    ports:
      - "80:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/"]
      interval: 15s
      timeout: 5s
      start_period: 10s
      start_interval: 2s
      retries: 3
    logging: *logging
