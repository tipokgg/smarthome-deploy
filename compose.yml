# Умный дом на домашнем сервере. Образы и их версии - в .env (BACKEND_IMAGE, FRONTEND_IMAGE),
# их переключает scripts/update.sh. Секреты бэкенда - в config/application.yml, база - в data/.
name: smarthome

x-logging: &logging
  driver: local
  options:
    max-size: 10m
    max-file: "5"

services:
  backend:
    image: ${BACKEND_IMAGE:?BACKEND_IMAGE не задан в .env}
    restart: unless-stopped
    environment:
      # тарифы день/ночь, расписания и история считаются по местному времени
      TZ: Europe/Moscow
      # бот для уведомлений о сбоях устройств и автоматизаций - тот же, что у scripts/update.sh
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      # мост к телевизорам Android TV - сервис ниже
      TV_BRIDGE_URL: http://tv-bridge:8090
      # брокер MQTT, через который приходят Zigbee-устройства из zigbee2mqtt; пусто - Zigbee не слушаем
      ZIGBEE_MQTT_URL: ${ZIGBEE_MQTT_URL:-}
    volumes:
      - ./config:/app/config:ro
      - ./data:/data
    # здесь, а не в образе: по нему scripts/update.sh решает, поднялась ли новая версия, и проверка не должна
    # зависеть от того, что в образе
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/actuator/health"]
      interval: 15s
      timeout: 5s
      start_period: 90s
      start_interval: 3s
      retries: 3
    logging: *logging

  # мост к телевизорам Android TV по протоколу пульта Google TV (исходник - smarthome-backend/tv-bridge).
  # Наружу порт не открыт: ходит к нему только бэкенд. В data/tv-bridge - сертификат, который телевизоры
  # запомнили при сопряжении: потеряется - сопрягать заново
  tv-bridge:
    image: ${TV_BRIDGE_IMAGE:-ghcr.io/tipokgg/smarthome-tv-bridge:main}
    restart: unless-stopped
    volumes:
      - ./data/tv-bridge:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      start_period: 10s
      start_interval: 2s
      retries: 3
    logging: *logging

  # Камеры: go2rtc забирает RTSP с камер и отдаёт видео браузеру через nginx фронта (/camera/ws). Какие камеры есть -
  # go2rtc.yaml рядом. Наружу порт не открыт: API go2rtc без авторизации и умеет запускать команды. Версия закреплена,
  # scripts/update.sh её не обновляет
  go2rtc:
    image: ${GO2RTC_IMAGE:-alexxit/go2rtc:1.9.14}
    restart: unless-stopped
    volumes:
      - ./go2rtc.yaml:/config/go2rtc.yaml:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:1984/api"]
      interval: 15s
      timeout: 5s
      start_period: 10s
      start_interval: 2s
      retries: 3
    logging: *logging

  # PDF утренней газеты: Chromium печатает страницу выпуска, бэкенд растрирует PDF для принтера (Xerox Phaser 3020
  # понимает только Apple Raster). Наружу порт не открыт; ходить Chromium может только к бэкенду - за страницей
  # и шрифтами. LibreOffice не нужен. Версия закреплена, scripts/update.sh её не обновляет
  gotenberg:
    image: ${GOTENBERG_IMAGE:-gotenberg/gotenberg:8.40.0}
    restart: unless-stopped
    command:
      - gotenberg
      - --chromium-allow-list=^http://backend:8080(/|$$)
      - --libreoffice-disable-routes
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:3000/health"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      start_interval: 2s
      retries: 3
    logging: *logging

  # Zigbee: координатор SMLIGHT SLZB-06P7U в сети (PoE, Ethernet), zigbee2mqtt ходит к нему по TCP и публикует
  # устройства в Mosquitto, бэкенд их оттуда слушает. Оба сервиса - в профиле zigbee: запускаются, только когда
  # в .env есть COMPOSE_PROFILES=zigbee (см. README). Версии закреплены, scripts/update.sh их не обновляет

  # Брокер MQTT. Наружу порт не открыт: без паролей, ходят к нему только zigbee2mqtt и бэкенд
  mosquitto:
    image: ${MOSQUITTO_IMAGE:-eclipse-mosquitto:2.0.23}
    profiles: [zigbee]
    restart: unless-stopped
    volumes:
      - ./mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./data/mosquitto:/mosquitto/data
    healthcheck:
      test: ["CMD", "mosquitto_sub", "-t", "$$SYS/broker/version", "-C", "1", "-W", "3"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      start_interval: 2s
      retries: 3
    logging: *logging

  # zigbee2mqtt. В data/zigbee2mqtt - configuration.yaml с ключом сети (zigbee2mqtt сам его создаёт при первом запуске
  # и переписывает файл), база устройств и копия координатора: потеряется - все устройства сопрягать заново.
  # Веб-интерфейс (сопряжение, карта сети) - http://<сервер>:8099, токен - ZIGBEE2MQTT_FRONTEND_TOKEN из .env
  zigbee2mqtt:
    image: ${ZIGBEE2MQTT_IMAGE:-koenkk/zigbee2mqtt:2.14.3}
    profiles: [zigbee]
    restart: unless-stopped
    user: "1000:1000"
    depends_on:
      mosquitto:
        condition: service_healthy
    environment:
      TZ: Europe/Moscow
      # переменные ZIGBEE2MQTT_CONFIG_* перекрывают configuration.yaml
      ZIGBEE2MQTT_CONFIG_SERIAL_PORT: tcp://${ZIGBEE_ADAPTER_HOST:-}:6638
      ZIGBEE2MQTT_CONFIG_FRONTEND_AUTH_TOKEN: ${ZIGBEE2MQTT_FRONTEND_TOKEN:-}
    volumes:
      - ./data/zigbee2mqtt:/app/data
    ports:
      - "8099:8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      start_interval: 3s
      retries: 3
    logging: *logging

  frontend:
    image: ${FRONTEND_IMAGE:?FRONTEND_IMAGE не задан в .env}
    restart: unless-stopped
    ports:
      - "80:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/"]
      interval: 15s
      timeout: 5s
      start_period: 10s
      start_interval: 2s
      retries: 3
    logging: *logging
