# go2rtc: забирает RTSP с камер и отдаёт видео браузеру (MSE по WebSocket через nginx фронта, /camera/ws).
# Порты наружу не открыты: API go2rtc без авторизации и умеет добавлять источники, которые запускают команды.
api:
  listen: ":1984"
# Свой RTSP-сервер - только внутри контейнера: через него перекодирование (ffmpeg) берёт поток и отдаёт результат
rtsp:
  listen: "127.0.0.1:8554"
# WebRTC не нужен: видео идёт через MSE
webrtc:
  listen: ""

streams:
  # Двор: Hipcam 192.168.10.173 (ONVIF на 8080). Камера шлёт H.265, его играют не все браузеры: им go2rtc отдаёт
  # вторую строку - перекодированный в H.264 поток (ffmpeg запускается, только пока такой браузер смотрит)
  yard:
    - rtsp://192.168.10.173:554/11
    - ffmpeg:yard#video=h264
  yard_sub:
    - rtsp://192.168.10.173:554/12
    - ffmpeg:yard_sub#video=h264
