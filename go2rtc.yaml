# go2rtc: забирает RTSP с камер и отдаёт видео браузеру (MSE по WebSocket через nginx фронта, /camera/ws).
# Порты наружу не открыты: API go2rtc без авторизации и умеет добавлять источники, которые запускают команды.
api:
  listen: ":1984"
# Свой RTSP-сервер - только внутри контейнера: через него ffmpeg отдаёт go2rtc пересобранный поток
rtsp:
  listen: "127.0.0.1:8554"
# WebRTC не нужен: видео идёт через MSE
webrtc:
  listen: ""

streams:
  # Двор: Hipcam 192.168.10.173 (ONVIF на 8080), с 07.11.2026 в H.264 (было H.265), ключевой кадр раз в 2 с.
  # Напрямую (rtsp://…) Chrome его не показывает: камера кладёт в sprop-parameter-sets SDP стартовые коды
  # `00 00 00 01`, и профиль кодека читается как 0 («Unrecognized video codec profile»). ffmpeg без перекодирования
  # (copy) пересобирает поток с правильными параметрами: ~1% ядра, запускается, только пока кто-то смотрит
  yard: ffmpeg:rtsp://192.168.10.173:554/11#video=copy#audio=copy
  yard_sub: ffmpeg:rtsp://192.168.10.173:554/12#video=copy#audio=copy
